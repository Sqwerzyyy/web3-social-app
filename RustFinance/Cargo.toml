[package]
name    = "pnl-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
rust_decimal        = { version = "1.35", features = ["serde-with-str"] }
rust_decimal_macros = "1.35"
chrono              = { version = "0.4", features = ["serde"] }
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
thiserror           = "1"
async-trait         = "0.1"
tokio               = { version = "1", features = ["full"] }
reqwest             = { version = "0.12", features = ["json"] }
uuid                = { version = "1", features = ["v4", "serde"] }
anyhow              = "1"
tracing             = "0.1"
tonic               = { version = "0.12", features = ["transport"] }
prost               = "0.13"
alloy               = { version = "2", features = ["full"], optional = true }
futures-util        = { version = "0.3", optional = true }
revm                = { version = "40", features = ["asyncdb", "optional_balance_check"], optional = true }
sqlx                = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json"], optional = true }
bincode            = { version = "2.0.1", features = ["serde"] }
tokio-stream       = "0.1"

[features]
default = []
evm-alloy = ["dep:alloy", "dep:futures-util", "dep:revm"]
postgres-idempotency = ["dep:sqlx"]

[build-dependencies]
tonic-build         = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
