[package]
name = "blockchain"
version = "0.1.0"
authors = ["You"]
edition = "2021"

[dependencies]
# Основная библиотека
ink = { version = "5.1.1", default-features = false }

# ЯВНО подключаем кодеки. Это лечит ошибку Mapping.
scale = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive"] }
scale-info = { version = "2.6", default-features = false, features = ["derive"] }

[dev-dependencies]
ink_e2e = { version = "5.1.1" }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",      # Обязательно
    "scale-info/std", # Обязательно
]
ink-as-dependency = []
e2e-tests = []
