version: '3.8'

services:
  # База данных: Сердце системы, где хранятся черновики документов
  db:
    image: postgres:15
    container_name: web3_mess_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: social_db
    ports:
      - "5432:5432"

  # Бэкенд на Node.js (отдел бэкенда работает здесь)
  backend:
    build: ./server
    container_name: web3_mess_backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:password1234@db:5432/social_db
    depends_on:
      - db
    volumes:
      - ./server:/app # Это позволит коду обновляться мгновенно без перезапуска докера

  # Блокчейн-нода (отдел блокчейна)
  blockchain:
    image: parity/substrate # Или другой образ по вашему выбору
    container_name: web3_mess_node
    ports:
      - "9944:9944"